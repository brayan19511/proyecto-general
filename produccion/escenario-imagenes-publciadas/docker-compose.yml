# Producción, escenario A: un servidor, un compose, imágenes del registro.
#
#   docker compose up -d                       (desde esta carpeta, con .env y env/*.env)
#   docker compose --profile admin up -d       (además pgAdmin en https://SITE_ADDRESS:8443)
#
# Sin "build:": las imágenes las publica el CI de cada servicio en el registro y
# aquí solo se elige su versión (.env). Actualizar un servicio = cambiar su
# *_VERSION y `docker compose up -d <servicio>` (su *-migrate corre antes).
#
# Variables:
#   .env           del compose: registro, versiones, dominio y modo de certificado.
#   env/*.env      de cada contenedor (credenciales y configuración). Ninguno en git.
#   secrets/auth/  llaves JWT de auth (jwt_private.pem, jwt_public.pem). Fuera de git.
#
# Redes (como en desarrollo): solo caddy publica puertos; la central habla con
# cada servicio por una red interna exclusiva de subred fija (TRUSTED_PROXIES).

name: plataforma

x-restart: &restart
  restart: unless-stopped

services:
  # Base en contenedor, con volumen. Alternativa recomendada: una base gestionada
  # (RDS, Cloud SQL, Azure Database): quitar este servicio y poner DB_HOST en env/*.env.
  # Respaldos: programar pg_dump fuera de este compose (ver README).
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: America/Lima
    volumes:
      - db:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    <<: *restart

  # --- Migraciones: corren y terminan antes de cada versión nueva ---
  auth-migrate:
    image: ${REGISTRY}/auth:${AUTH_VERSION}
    command: ["sh", "-c", "python -m alembic upgrade head && python scripts/migrate_audit.py"]
    env_file: env/auth.env
    environment: { DB_HOST: db, DB_PORT: "5432" }
    networks: [data]
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  # En cadena (como en desarrollo): todas migran también el schema audit y no
  # deben hacerlo a la vez. auth → apigateway → libro-mayor → notificaciones → pagos-proveedores.
  apigateway-migrate:
    image: ${REGISTRY}/apigateway:${APIGATEWAY_VERSION}
    command: ["sh", "-c", "python -m alembic upgrade head && python scripts/migrate_audit.py"]
    env_file: env/apigateway.env
    # Las URL solo porque la configuración las exige; no se usan al migrar.
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      AUTH_URL: http://auth.internal:8000
      LIBRO_MAYOR_URL: http://libro-mayor.internal:8000
      NOTIFICACIONES_URL: http://notificaciones.internal:8000
      PAGOS_PROVEEDORES_URL: http://pagos-proveedores.internal:8000
    networks: [data]
    depends_on: { auth-migrate: { condition: service_completed_successfully } }
    restart: "no"

  libro-mayor-migrate:
    image: ${REGISTRY}/libro-mayor:${LIBRO_MAYOR_VERSION}
    command: ["sh", "-c", "python -m alembic upgrade head && python scripts/migrate_audit.py"]
    env_file: env/libro-mayor.env
    environment: { DB_HOST: db, DB_PORT: "5432", AUTH_URL: "http://auth.internal:8000" }
    networks: [data]
    depends_on: { apigateway-migrate: { condition: service_completed_successfully } }
    restart: "no"

  notificaciones-migrate:
    image: ${REGISTRY}/notificaciones:${NOTIFICACIONES_VERSION}
    command: ["sh", "-c", "python -m alembic upgrade head && python scripts/migrate_audit.py"]
    env_file: env/notificaciones.env
    # AUTH_URL solo porque la configuración lo exige; no se usa al migrar.
    environment: { DB_HOST: db, DB_PORT: "5432", AUTH_URL: "http://auth.internal:8000" }
    networks: [data]
    depends_on: { libro-mayor-migrate: { condition: service_completed_successfully } }
    restart: "no"

  pagos-proveedores-migrate:
    image: ${REGISTRY}/pagos-proveedores:${PAGOS_PROVEEDORES_VERSION}
    command: ["sh", "-c", "python -m alembic upgrade head && python scripts/migrate_audit.py"]
    env_file: env/pagos-proveedores.env
    # Las URL solo porque la configuración las exige; no se usan al migrar.
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      AUTH_URL: http://auth.internal:8000
      NOTIFICACIONES_URL: http://notificaciones.internal:8000
    networks: [data]
    depends_on: { notificaciones-migrate: { condition: service_completed_successfully } }
    restart: "no"

  # --- Servicios ---
  auth:
    image: ${REGISTRY}/auth:${AUTH_VERSION}
    env_file: env/auth.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      # Solo la central (auth-net) puede informar la IP real del cliente.
      TRUSTED_PROXIES: '["172.30.0.0/24"]'
    volumes:
      - ./secrets/auth:/app/services/auth/secrets:ro
    networks:
      data:
      auth-net:
        aliases: [auth.internal]
    depends_on: { auth-migrate: { condition: service_completed_successfully } }
    <<: *restart

  libro-mayor:
    image: ${REGISTRY}/libro-mayor:${LIBRO_MAYOR_VERSION}
    env_file: env/libro-mayor.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      AUTH_URL: http://auth.internal:8000
      TRUSTED_PROXIES: '["172.31.0.0/24"]'
    networks:
      data:
      auth-net:
      sap-egress:
      libro-mayor-net:
        aliases: [libro-mayor.internal]
    depends_on: { libro-mayor-migrate: { condition: service_completed_successfully } }
    <<: *restart

  libro-mayor-worker:
    image: ${REGISTRY}/libro-mayor:${LIBRO_MAYOR_VERSION}
    command: ["python", "-m", "app.worker"]
    env_file: env/libro-mayor.env
    environment: { DB_HOST: db, DB_PORT: "5432", AUTH_URL: "http://auth.internal:8000" }
    networks: [data, sap-egress]
    healthcheck: { disable: true } # el HEALTHCHECK de la imagen es el de la API
    depends_on: { libro-mayor-migrate: { condition: service_completed_successfully } }
    <<: *restart

  # Notificaciones: API (cuentas SMTP, plantillas, envíos). Solo la central y
  # pagos-proveedores llegan a ella (notificaciones-net); valida cada token con auth.
  notificaciones:
    image: ${REGISTRY}/notificaciones:${NOTIFICACIONES_VERSION}
    env_file: env/notificaciones.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      AUTH_URL: http://auth.internal:8000
      TRUSTED_PROXIES: '["172.33.0.0/24"]'
    networks:
      data:
      auth-net:
      smtp-egress: # probar cuentas (POST /smtp-accounts/{id}/test)
      notificaciones-net:
        aliases: [notificaciones.internal]
    depends_on: { notificaciones-migrate: { condition: service_completed_successfully } }
    <<: *restart

  # Envía los pendientes, reintenta y aplica la retención. Siempre levantado;
  # varias réplicas pueden convivir (SKIP LOCKED).
  notificaciones-worker:
    image: ${REGISTRY}/notificaciones:${NOTIFICACIONES_VERSION}
    command: ["python", "-m", "app.worker"]
    env_file: env/notificaciones.env
    environment: { DB_HOST: db, DB_PORT: "5432", AUTH_URL: "http://auth.internal:8000" }
    networks: [data, smtp-egress]
    healthcheck: { disable: true } # el HEALTHCHECK de la imagen es el de la API
    stop_grace_period: 2m # termina el mensaje en curso al detenerse
    depends_on: { notificaciones-migrate: { condition: service_completed_successfully } }
    <<: *restart

  # Pagos a proveedores: lotes de constancias (PDF + OCR) y avisos por notificaciones.
  pagos-proveedores:
    image: ${REGISTRY}/pagos-proveedores:${PAGOS_PROVEEDORES_VERSION}
    env_file: env/pagos-proveedores.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      AUTH_URL: http://auth.internal:8000
      # Directo a notificaciones (no por la central), con el token del usuario.
      NOTIFICACIONES_URL: http://notificaciones.internal:8000
      TRUSTED_PROXIES: '["172.34.0.0/24"]'
    networks:
      data:
      auth-net:
      notificaciones-net:
      pagos-proveedores-net:
        aliases: [pagos-proveedores.internal]
    depends_on: { pagos-proveedores-migrate: { condition: service_completed_successfully } }
    <<: *restart

  apigateway:
    image: ${REGISTRY}/apigateway:${APIGATEWAY_VERSION}
    env_file: env/apigateway.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      AUTH_URL: http://auth.internal:8000
      LIBRO_MAYOR_URL: http://libro-mayor.internal:8000
      NOTIFICACIONES_URL: http://notificaciones.internal:8000
      PAGOS_PROVEEDORES_URL: http://pagos-proveedores.internal:8000
      # Solo caddy (proxy-net) puede informar la IP real del cliente.
      TRUSTED_PROXIES: '["172.32.0.0/24"]'
    networks:
      data:
      auth-net:
      libro-mayor-net:
      notificaciones-net:
      pagos-proveedores-net:
      proxy-net:
        aliases: [apigateway.proxy]
    depends_on: { apigateway-migrate: { condition: service_completed_successfully } }
    <<: *restart

  # Build con VITE_API_URL=/ (mismo origen): la misma imagen sirve en cualquier dominio.
  front-central:
    image: ${REGISTRY}/front-central:${FRONT_VERSION}
    environment:
      API_ORIGIN: "'self'"
    networks:
      proxy-net:
        aliases: [front-central.proxy]
    <<: *restart

  # Única entrada: HTTPS, 100 MB por solicitud, reenvío (services/edge).
  caddy:
    image: ${REGISTRY}/edge-caddy:${EDGE_VERSION}
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.${CADDY_TLS:-dns}", "--adapter", "caddyfile"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    env_file:
      - path: env/edge.env
        required: false # solo hace falta en modo dns
    ports:
      - "${EDGE_BIND:-0.0.0.0}:80:80"
      - "${EDGE_BIND:-0.0.0.0}:443:443"
      - "${EDGE_BIND:-0.0.0.0}:8443:8443" # pgAdmin (perfil admin); cerrarlo en el firewall si no se usa
    volumes:
      - caddy_data:/data # certificados: no borrar
      - caddy_config:/config
    networks:
      edge:
      proxy-net:
        ipv4_address: 172.32.0.10
    <<: *restart

  # Opcional: docker compose --profile admin up -d
  pgadmin:
    image: dpage/pgadmin4:8
    profiles: [admin]
    env_file: env/pgadmin.env
    networks:
      data:
      proxy-net:
        aliases: [pgadmin.proxy]
    depends_on: { db: { condition: service_healthy } }
    <<: *restart

networks:
  edge:
  data:
    internal: true # la base no sale a internet
  auth-net:
    internal: true
    ipam: { config: [{ subnet: 172.30.0.0/24 }] }
  libro-mayor-net:
    internal: true
    ipam: { config: [{ subnet: 172.31.0.0/24 }] }
  proxy-net:
    internal: true
    ipam: { config: [{ subnet: 172.32.0.0/24 }] }
  notificaciones-net:
    internal: true
    ipam: { config: [{ subnet: 172.33.0.0/24 }] }
  pagos-proveedores-net:
    internal: true
    ipam: { config: [{ subnet: 172.34.0.0/24 }] }
  sap-egress: # salida hacia SAP HANA
  smtp-egress: # salida hacia los servidores SMTP

volumes:
  db:
  caddy_data:
  caddy_config:
