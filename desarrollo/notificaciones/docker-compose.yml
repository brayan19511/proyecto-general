# Desarrollo de notificaciones solo: su base, la API y el worker, construidos
# desde services/notificaciones. Valida tokens con un auth corriendo: por
# defecto el de desarrollo/auth (http://host.docker.internal:8000).
#
#   docker compose --env-file ../../services/notificaciones/.env up -d --build   (desde desarrollo/notificaciones)
#
# El worker sale a los servidores SMTP configurados en las cuentas de la empresa.

name: dev-notificaciones

x-notificaciones: &notificaciones
  image: notificaciones:dev
  volumes:
    - ../../services/notificaciones/.env:/app/services/notificaciones/.env:ro
  environment:
    DB_HOST: db
    DB_PORT: "5432"
    AUTH_URL: ${DEV_AUTH_URL:-http://host.docker.internal:8000}
    # Clientes directos (sin proxy delante): no confía en X-Forwarded-For.
    TRUSTED_PROXIES: "[]"
  # host.docker.internal también en Linux (en Docker Desktop ya existe).
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: America/Lima
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5436}:5432"
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  notificaciones-migrate:
    <<: *notificaciones
    build:
      context: ../..
      dockerfile: services/notificaciones/Dockerfile
    command: ["sh", "-c", "python -m alembic upgrade head && python scripts/migrate_audit.py"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # API: http://localhost:8010/notificaciones/docs
  notificaciones:
    <<: *notificaciones
    pull_policy: never
    ports:
      - "127.0.0.1:${DEV_NOTIFICACIONES_PORT:-8010}:8000"
    depends_on:
      notificaciones-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Envía los mensajes pendientes y aplica la retención (misma imagen, otro comando).
  notificaciones-worker:
    <<: *notificaciones
    pull_policy: never
    command: ["python", "-m", "app.worker"]
    healthcheck:
      disable: true # el HEALTHCHECK de la imagen es el de la API
    stop_grace_period: 2m # termina el mensaje en curso al detenerse
    depends_on:
      notificaciones-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db:
