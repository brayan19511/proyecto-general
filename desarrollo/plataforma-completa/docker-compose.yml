# Entorno completo: PostgreSQL, pgAdmin, auth, libro-mayor (API y worker), la API central,
# el front (front-central) y el proxy de borde con HTTPS (caddy).
#
#   docker compose --env-file ../../services/apigateway/.env up -d --build
#   (desde desarrollo/plataforma-completa; o copiar ese .env aquí como .env y omitir --env-file)
#
# Cada imagen se construye una vez, en su contenedor de migración (*-migrate);
# la app y el worker la reutilizan (pull_policy: never).
#
# Variables del compose (DB_*, PGADMIN_*, puertos, binds e imágenes): el .env de la
# central (services/apigateway/.env), pasado con --env-file.
# Cada aplicación lee además su propio .env, montado de solo lectura; los
# valores de "environment" tienen prioridad y ajustan lo que cambia dentro de Docker.
#
# Redes:
#   edge       redes con puertos publicados: caddy (80/443/8443), la central (desarrollo)
#              y la base. Cada uno escucha en su *_BIND (127.0.0.1 por defecto).
#   proxy-net  exclusiva de caddy con la central, el front y pgAdmin, subred fija:
#              la central confía en ella (TRUSTED_PROXIES) para leer la IP real.
#   auth-net   exclusiva de la central y auth, subred fija: auth confía en ella
#              (TRUSTED_PROXIES). Sin salida a internet ni acceso desde fuera.
#   data       la base; auth, libro-mayor y la central escriben aquí (datos y logs).
#   libro-mayor-net  exclusiva de la central y libro-mayor, subred fija (su
#              TRUSTED_PROXIES). Sin salida a internet ni acceso desde fuera.
#   sap-egress salida hacia SAP HANA (fuera de la plataforma) para la API y el
#              worker de libro-mayor.

# Mismo nombre de proyecto que el Compose anterior (carpeta proyecto-central):
# reutiliza los contenedores y el volumen existentes en lugar de crear otros.
name: proyecto-central

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: America/Lima
    # Por defecto solo esta máquina (DB_BIND=127.0.0.1). Desde la red se entra por
    # pgAdmin (vía caddy) o por un túnel SSH; no abrir la base directamente.
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_PORT}:5432"
    volumes:
      - db:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:7.7
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    # Sin puerto propio: se entra por caddy en https://SITE_ADDRESS:8443.
    networks:
      data:
      proxy-net:
        aliases: [pgadmin.proxy]
    depends_on:
      db:
        condition: service_healthy

  # Migraciones: contenedores de un solo uso con la misma imagen de cada app.
  # En cada "up" aplican lo pendiente (alembic upgrade head + schema audit) y
  # terminan; la app arranca solo si terminaron bien. Sin cambios pendientes
  # no hacen nada. Los seeds NO se ejecutan aquí: siguen siendo manuales.
  # Ver el resultado: docker compose logs auth-migrate apigateway-migrate
  auth-migrate:
    image: ${AUTH_IMAGE:-auth:0.1.0}
    build:
      context: ../..
      dockerfile: services/auth/Dockerfile
    command: ["sh", "-c", "python -m alembic upgrade head && python scripts/migrate_audit.py"]
    volumes:
      - ../../services/auth/.env:/app/services/auth/.env:ro
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    networks: [data]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  apigateway-migrate:
    image: ${APIGATEWAY_IMAGE:-apigateway:0.1.0}
    build:
      context: ../..
      dockerfile: services/apigateway/Dockerfile
    command: ["sh", "-c", "python -m alembic upgrade head && python scripts/migrate_audit.py"]
    volumes:
      - ../../services/apigateway/.env:/app/services/apigateway/.env:ro
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      AUTH_URL: http://auth.internal:8000   # Solo porque la configuración lo exige; no se usa al migrar.
    networks: [data]
    restart: "no"
    depends_on:
      # Después de auth-migrate: ambos migran el schema audit y no deben hacerlo a la vez.
      auth-migrate:
        condition: service_completed_successfully

  libro-mayor-migrate:
    image: ${LIBRO_MAYOR_IMAGE:-libro-mayor:0.1.0}
    build:
      context: ../..
      dockerfile: services/libro-mayor/Dockerfile
    command: ["sh", "-c", "python -m alembic upgrade head && python scripts/migrate_audit.py"]
    volumes:
      - ../../services/libro-mayor/.env:/app/services/libro-mayor/.env:ro
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      AUTH_URL: http://auth.internal:8000   # Solo porque la configuración lo exige; no se usa al migrar.
    networks: [data]
    restart: "no"
    depends_on:
      # Último de la cadena: también migra el schema audit.
      apigateway-migrate:
        condition: service_completed_successfully

  auth:
    # Versión fija de la imagen; cambiarla aquí (o con AUTH_IMAGE en .env).
    image: ${AUTH_IMAGE:-auth:0.1.0}
    # La construye auth-migrate (una sola vez): construirla aquí también en paralelo
    # choca con la misma etiqueta. never = usar la local, no buscarla en Docker Hub.
    pull_policy: never
    # Sin "ports": solo la central llega a auth.
    volumes:
      - ../../services/auth/.env:/app/services/auth/.env:ro
      - ../../services/auth/secrets:/app/services/auth/secrets:ro
    environment:
      DB_HOST: db
      DB_PORT: "5432"                     # puerto interno de PostgreSQL, no el publicado
      # Rutas absolutas dentro del contenedor (las del .env son relativas).
      JWT_PRIVATE_KEY_FILE: /app/services/auth/secrets/jwt_private.pem
      JWT_PUBLIC_KEY_FILE: /app/services/auth/secrets/jwt_public.pem
      # Solo se confía en X-Forwarded-For / X-Trace-Id si llegan por auth-net.
      TRUSTED_PROXIES: '["172.30.0.0/24"]'
    networks:
      data:
      auth-net:
        # Nombre que solo existe en auth-net: la central lo usa en AUTH_URL,
        # así su conexión sale siempre desde su IP de auth-net (confiable) y no
        # desde la red data, que auth no reconoce como proxy.
        aliases: [auth.internal]
    depends_on:
      db:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully   # Arranca con su base al día.

  libro-mayor:
    image: ${LIBRO_MAYOR_IMAGE:-libro-mayor:0.1.0}
    # La construye libro-mayor-migrate (una sola vez): construirla aquí también en paralelo
    # choca con la misma etiqueta. never = usar la local, no buscarla en Docker Hub.
    pull_policy: never
    # Sin "ports": solo la central llega a libro-mayor.
    volumes:
      - ../../services/libro-mayor/.env:/app/services/libro-mayor/.env:ro
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      # Pregunta identidad y permisos a auth por auth-net (como la central).
      AUTH_URL: http://auth.internal:8000
      # Solo se confía en X-Forwarded-For / X-Trace-Id si llegan por libro-mayor-net.
      TRUSTED_PROXIES: '["172.31.0.0/24"]'
    networks:
      data:
      auth-net:
      sap-egress:
      libro-mayor-net:
        # Solo existe en libro-mayor-net: la central lo usa en LIBRO_MAYOR_URL.
        aliases: [libro-mayor.internal]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      libro-mayor-migrate:
        condition: service_completed_successfully

  # Sincronización programada y reclasificaciones. Misma imagen; debe estar
  # siempre levantado (restart). Con SYNC_SCHEDULE=off solo procesa lo manual.
  libro-mayor-worker:
    image: ${LIBRO_MAYOR_IMAGE:-libro-mayor:0.1.0}
    # La construye libro-mayor-migrate (una sola vez): construirla aquí también en paralelo
    # choca con la misma etiqueta. never = usar la local, no buscarla en Docker Hub.
    pull_policy: never
    command: ["python", "-m", "app.worker"]
    volumes:
      - ../../services/libro-mayor/.env:/app/services/libro-mayor/.env:ro
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      AUTH_URL: http://auth.internal:8000   # Solo porque la configuración lo exige; el worker no llama a auth.
    networks: [data, sap-egress]
    healthcheck:
      disable: true   # El HEALTHCHECK de la imagen es de la API (HTTP); el worker no la sirve.
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      libro-mayor-migrate:
        condition: service_completed_successfully

  apigateway:
    image: ${APIGATEWAY_IMAGE:-apigateway:0.1.0}
    # La construye apigateway-migrate (una sola vez): construirla aquí también en paralelo
    # choca con la misma etiqueta. never = usar la local, no buscarla en Docker Hub.
    pull_policy: never
    # Solo accesible desde esta máquina. GATEWAY_PORT en .env si 8001 está ocupado.
    # Acceso directo para desarrollo (npm run dev). Desde la red se entra por caddy.
    ports:
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8001}:8000"
    volumes:
      - ../../services/apigateway/.env:/app/services/apigateway/.env:ro
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      AUTH_URL: http://auth.internal:8000
      # Publicar libro-mayor: LIBRO_MAYOR_ENABLED=true en el .env de la central.
      LIBRO_MAYOR_URL: http://libro-mayor.internal:8000
      # Solo caddy (proxy-net) puede informar la IP real del cliente.
      TRUSTED_PROXIES: '["172.32.0.0/24"]'
    networks:
      edge:
      data:
      auth-net:
      libro-mayor-net:
      proxy-net:
        aliases: [apigateway.proxy]
    # No depende de auth: arranca y está "ready" aunque auth no esté (responde
    # 502 solo en /auth/*). Sí espera a que su base esté migrada.
    depends_on:
      db:
        condition: service_healthy
      apigateway-migrate:
        condition: service_completed_successfully


  # Front (React): nginx con el build estático, detrás de caddy. Front y API
  # comparten origen (https://SITE_ADDRESS): sin CORS.
  front-central:
    image: ${FRONT_CENTRAL_IMAGE:-front-central:0.1.0}
    build:
      context: ../../services/front-central
      args:
        # "/" = mismo origen que el front (caddy reenvía /auth, /libro-mayor y
        # /gateway a la central). Se fija en el build.
        VITE_API_URL: ${FRONT_API_URL:-/}
    environment:
      # Origen extra permitido en la CSP para llamar a la API ('self' = el mismo).
      API_ORIGIN: "${FRONT_CSP_API_ORIGIN:-'self'}"
    networks:
      proxy-net:
        aliases: [front-central.proxy]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Proxy de borde: única entrada desde la red (HTTP en la red local o HTTPS con dominio). Solo TLS, límite de
  # tamaño (100 MB) y reenvío; sin reglas de negocio (ver services/edge).
  caddy:
    image: ${EDGE_IMAGE:-edge-caddy:0.1.0}
    build:
      context: ../../services/edge
    # Modo: http (red local sin dominio, nada que instalar; default), internal (CA
    # propia, solo esta máquina) o dns (dominio propio + Let's Encrypt; requiere
    # services/edge/.env). Ver services/edge/README.md.
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.${CADDY_TLS:-http}", "--adapter", "caddyfile"]
    ports:
      - "${EDGE_BIND:-127.0.0.1}:${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_BIND:-127.0.0.1}:${EDGE_HTTPS_PORT:-443}:443"
      - "${EDGE_BIND:-127.0.0.1}:${EDGE_PGADMIN_PORT:-8443}:8443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    # ACME_EMAIL y CLOUDFLARE_API_TOKEN (solo modo dns). Opcional en modo internal.
    env_file:
      - path: ../../services/edge/.env
        required: false
    volumes:
      - caddy_data:/data       # certificados y la CA interna (no borrar)
      - caddy_config:/config
    networks:
      edge:
      proxy-net:
        # IP fija dentro de la subred confiable de la central.
        ipv4_address: 172.32.0.10
    restart: unless-stopped

networks:
  edge:
  data:
  auth-net:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  libro-mayor-net:
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24
  sap-egress:
  proxy-net:
    internal: true
    ipam:
      config:
        - subnet: 172.32.0.0/24

volumes:
  db:
    name: db
  caddy_data:
  caddy_config:
